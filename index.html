<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List UI</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            background: white;
            padding: 25px;
            width: 380px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            color: #e84393;
        }

        .user-card{
            background: #ffeaa7;
            padding: 15px;
            margin-top: 12px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .user-card:hover{
            background: #fab1a0;
            transform: scale(1.03);
        }

        h3{
            color: #6c5ce7;
        }

        p{
            color: #2d3436;
        }

        button{
            margin-top: 18px;
            padding: 12px 22px;
            border: none;
            background: #00b894;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover{
            background: #019875;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>👥 User List</h1>

        <div id="userContainer"></div>

        <button id="addBtn">➕ Add User</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
